[build]
  command = "pnpm build"
  publish = "dist"

# Redirects for URLs indexed by Google with wrong collection paths
[[redirects]]
  from = "/concepts/context-gates"
  to = "/patterns/context-gates/"
  status = 301

[[redirects]]
  from = "/concepts/context-gates/"
  to = "/patterns/context-gates/"
  status = 301

[[redirects]]
  from = "/concepts/experience-modeling"
  to = "/patterns/experience-modeling/"
  status = 301

[[redirects]]
  from = "/concepts/experience-modeling/"
  to = "/patterns/experience-modeling/"
  status = 301

[[redirects]]
  from = "/concepts/ooda-loop"
  to = "/concepts/ooda-loop/"
  status = 301

# Agents predict URLs from semantics: "/skills" is the common guess when
# asked about ASDLC skills guidance (observed in the wild, 2026-07). Land the
# guess on the canonical article instead of a 404.
[[redirects]]
  from = "/skills"
  to = "/concepts/agent-skills/"
  status = 301

[[redirects]]
  from = "/skills/"
  to = "/concepts/agent-skills/"
  status = 301

[[redirects]]
  from = "/skill"
  to = "/concepts/agent-skills/"
  status = 301

[[redirects]]
  from = "/manuscript"
  to = "/fieldmanual/"
  status = 301

[[redirects]]
  from = "/manuscript/"
  to = "/fieldmanual/"
  status = 301

# Agent discovery headers (AL-93) — advertise the agent surface (MCP endpoint,
# llms.txt, api-catalog, sitemap) at the HTTP layer per RFC 8288 (Link header)
# and RFC 9727 (api-catalog).
[[headers]]
  for = "/*"
  [headers.values]
    Link = "</.well-known/api-catalog>; rel=\"api-catalog\", </llms.txt>; rel=\"llms-txt\", </sitemap-index.xml>; rel=\"sitemap\""

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"
